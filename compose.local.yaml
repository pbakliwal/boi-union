name: boi-union-local

x-app: &app
  image: boi-union-local-app
  build:
    context: .
    dockerfile: Dockerfile.local
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: boi_union
      POSTGRES_USER: boi_union
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run scripts/start-local.ps1 first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boi_union -d boi_union"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    <<: *app
    command: ["sh", "-c", "npm run migrate && npm run setup && npm run dev:api"]
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://boi_union:${LOCAL_DB_PASSWORD:?Run scripts/start-local.ps1 first}@db:5432/boi_union
      DATABASE_SSL: "false"
      SESSION_SECRET: ${LOCAL_SESSION_SECRET:?Run scripts/start-local.ps1 first}
      ADMIN_USER: ${LOCAL_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?Run scripts/start-local.ps1 first}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 24

  web:
    <<: *app
    command: ["npm", "run", "dev", "-w", "client", "--", "--host", "0.0.0.0", "--strictPort"]
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all(['/', '/api/health'].map(p=>fetch('http://127.0.0.1:5173'+p).then(r=>{if(!r.ok)throw Error(r.status)}))).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  postgres-data:
