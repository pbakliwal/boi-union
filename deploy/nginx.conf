# Reverse proxy for the BOI Union app.
# Copy to /etc/nginx/sites-available/boi-union, symlink into sites-enabled,
# replace your-domain.com, then run: certbot --nginx -d your-domain.com
# (certbot will rewrite this file to add the SSL server block automatically).

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 25m;  # allow the Excel/CSV import uploads
}
